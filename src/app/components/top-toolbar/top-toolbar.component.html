<header class="h-16 bg-slate-900 border-b border-slate-800 px-4 sm:px-6 flex items-center justify-between z-50 select-none shadow-md">
  <!-- App Brand Logo & Name -->
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center font-extrabold text-white text-sm shadow-lg tracking-wider">
      GP
    </div>
    <div>
      <h1 class="text-sm font-extrabold text-slate-100 tracking-tight leading-none">Portfolio Builder</h1>
      <span class="text-[10px] font-bold text-indigo-400 tracking-widest uppercase">BY GANGADHAR</span>
    </div>

    <!-- Theme Quick Selector -->
    <div class="hidden md:flex items-center gap-2 ml-6 pl-6 border-l border-slate-800">
      <span class="text-xs font-semibold text-slate-400">Theme:</span>
      <select
        [value]="state.portfolio().themePreset"
        (change)="onThemeChange($event)"
        class="bg-slate-950 border border-slate-800 text-xs font-bold text-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer"
      >
        <option value="dark">Midnight Dark</option>
        <option value="light">Clean Light</option>
        <option value="blue">Oceanic Blue</option>
        <option value="purple">Cyber Neon Purple</option>
        <option value="emerald">Forest Emerald</option>
        <option value="orange">Sunset Amber</option>
        <option value="minimal">Monochrome Minimal</option>
        <option value="corporate">Corporate Slate</option>
        <option value="developer">Matrix Terminal</option>
        <option value="glassmorphism">Glassmorphism</option>
        <option value="neumorphism">Neumorphism</option>
      </select>
    </div>
  </div>

  <!-- Center Auto-Save Indicator -->
  <div class="hidden lg:flex items-center gap-2 text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    Autosaved to LocalStorage
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-2">
    <!-- History Controls -->
    <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 mr-2">
      <button
        (click)="state.undo()"
        [disabled]="!state.canUndo()"
        class="p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer transition-colors"
        title="Undo (Ctrl+Z)"
      >
        <app-icon name="undo-2" [size]="16"></app-icon>
      </button>
      <button
        (click)="state.redo()"
        [disabled]="!state.canRedo()"
        class="p-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer transition-colors"
        title="Redo (Ctrl+Y)"
      >
        <app-icon name="redo-2" [size]="16"></app-icon>
      </button>
    </div>

    <!-- Live Preview Toggle -->
    <button
      (click)="state.togglePreviewMode()"
      [class.bg-indigo-600]="state.previewMode()"
      [class.text-white]="state.previewMode()"
      [class.bg-slate-950]="!state.previewMode()"
      [class.text-slate-300]="!state.previewMode()"
      class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-800 hover:border-slate-700 transition-all cursor-pointer shadow-sm"
    >
      <app-icon name="eye" [size]="16"></app-icon>
      <span>{{ state.previewMode() ? 'Exit Preview' : 'Live Preview' }}</span>
    </button>

    <!-- Export ZIP Button -->
    <button
      (click)="exportZip()"
      [disabled]="isExporting"
      class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-extrabold text-white bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 transition-all shadow-lg active:scale-95 cursor-pointer disabled:opacity-50"
    >
      <app-icon name="download" [size]="16"></app-icon>
      <span>{{ isExporting ? 'Exporting...' : 'Export ZIP' }}</span>
    </button>

    <!-- Reset Button -->
    <button
      (click)="state.resetToDefault()"
      class="p-2 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition-colors cursor-pointer border border-slate-800 ml-1"
      title="Reset All Data"
    >
      <app-icon name="rotate-ccw" [size]="16"></app-icon>
    </button>
  </div>
</header>
