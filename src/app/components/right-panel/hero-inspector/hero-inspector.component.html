<div class="space-y-5">
  <div class="flex items-center justify-between pb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <h3 class="text-sm font-bold text-indigo-400 uppercase tracking-wider">Hero Section Editor</h3>
      <span class="text-xs bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded font-mono font-bold">#hero</span>
    </div>
    <button
      type="button"
      (click)="state.toggleSectionVisibility('hero')"
      class="flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-lg border transition-all cursor-pointer shadow-sm"
      [ngClass]="state.portfolio().hero.visible ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-rose-950/80 border-rose-800 text-rose-300 hover:bg-rose-900'"
      [title]="state.portfolio().hero.visible ? 'Hide Hero section' : 'Show Hero section'"
    >
      <app-icon [name]="state.portfolio().hero.visible ? 'eye' : 'eye-off'" [size]="14"></app-icon>
      <span>{{ state.portfolio().hero.visible ? 'Hide Section' : 'Show Section' }}</span>
    </button>
  </div>

  <!-- Hero Profile Image Picker (Upload File OR Image Link) -->
  <app-image-picker
    label="Profile / Avatar Image"
    [imageUrl]="hero.profileImage || ''"
    (imageUrlChange)="update({ profileImage: $event })"
  ></app-image-picker>

  <!-- PROFILE IMAGE SHAPE & STYLING CONTROLS -->
  <div *ngIf="hero.profileImage" class="space-y-3 p-4 rounded-xl border border-slate-800 bg-slate-900/60">
    <label class="text-xs font-extrabold text-slate-200 uppercase tracking-wide">Image Shape & Border Style</label>

    <!-- Shape Pills: Circle, Rounded, Square -->
    <div class="grid grid-cols-3 gap-2 pt-1">
      <button
        (click)="update({ imageShape: 'circle' })"
        [class.bg-indigo-600]="hero.imageShape === 'circle'"
        [class.text-white]="hero.imageShape === 'circle'"
        [class.bg-slate-950]="hero.imageShape !== 'circle'"
        [class.text-slate-300]="hero.imageShape !== 'circle'"
        class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700/60 text-xs font-bold transition-all cursor-pointer"
      >
        <div class="w-5 h-5 rounded-full border-2 border-current mb-1"></div>
        <span>Circle</span>
      </button>

      <button
        (click)="update({ imageShape: 'rounded' })"
        [class.bg-indigo-600]="hero.imageShape === 'rounded'"
        [class.text-white]="hero.imageShape === 'rounded'"
        [class.bg-slate-950]="hero.imageShape !== 'rounded'"
        [class.text-slate-300]="hero.imageShape !== 'rounded'"
        class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700/60 text-xs font-bold transition-all cursor-pointer"
      >
        <div class="w-5 h-5 rounded-lg border-2 border-current mb-1"></div>
        <span>Rounded</span>
      </button>

      <button
        (click)="update({ imageShape: 'square' })"
        [class.bg-indigo-600]="hero.imageShape === 'square'"
        [class.text-white]="hero.imageShape === 'square'"
        [class.bg-slate-950]="hero.imageShape !== 'square'"
        [class.text-slate-300]="hero.imageShape !== 'square'"
        class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700/60 text-xs font-bold transition-all cursor-pointer"
      >
        <div class="w-5 h-5 border-2 border-current mb-1"></div>
        <span>Square</span>
      </button>
    </div>

    <!-- Border & Shadow Toggles -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
      <label class="text-xs font-bold text-slate-300">Accent Color Border</label>
      <input
        type="checkbox"
        [ngModel]="hero.imageBorder"
        (ngModelChange)="update({ imageBorder: $event })"
        class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
      />
    </div>

    <div class="flex items-center justify-between pt-1">
      <label class="text-xs font-bold text-slate-300">Drop Shadow</label>
      <input
        type="checkbox"
        [ngModel]="hero.imageShadow"
        (ngModelChange)="update({ imageShadow: $event })"
        class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
      />
    </div>
  </div>

  <!-- Name & Color -->
  <div class="space-y-1.5">
    <div class="flex justify-between items-center">
      <label class="text-xs font-bold text-slate-200">Full Name</label>
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400">Color</span>
        <input
          type="color"
          [value]="hero.nameColor || state.portfolio().colors.heading"
          (input)="update({ nameColor: $any($event.target).value })"
          class="w-7 h-7 rounded-lg border border-slate-700 bg-transparent cursor-pointer p-0.5"
        />
        <button
          *ngIf="hero.nameColor"
          (click)="update({ nameColor: undefined })"
          class="p-1 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
          title="Reset Name Color"
        >
          <app-icon name="rotate-ccw" [size]="14"></app-icon>
        </button>
      </div>
    </div>
    <input
      type="text"
      [ngModel]="hero.name"
      (ngModelChange)="update({ name: $event })"
      class="w-full bg-slate-900 border border-slate-700 text-sm font-semibold text-slate-100 rounded-xl p-3 focus:outline-none focus:border-indigo-500"
    />
  </div>

  <!-- Role / Tagline & Color -->
  <div class="space-y-1.5">
    <div class="flex justify-between items-center">
      <label class="text-xs font-bold text-slate-200">Role / Tagline</label>
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400">Color</span>
        <input
          type="color"
          [value]="hero.roleColor || state.portfolio().colors.primary"
          (input)="update({ roleColor: $any($event.target).value })"
          class="w-7 h-7 rounded-lg border border-slate-700 bg-transparent cursor-pointer p-0.5"
        />
        <button
          *ngIf="hero.roleColor"
          (click)="update({ roleColor: undefined })"
          class="p-1 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
          title="Reset Role Color"
        >
          <app-icon name="rotate-ccw" [size]="14"></app-icon>
        </button>
      </div>
    </div>
    <input
      type="text"
      [ngModel]="hero.role"
      (ngModelChange)="update({ role: $event })"
      class="w-full bg-slate-900 border border-slate-700 text-sm font-semibold text-slate-100 rounded-xl p-3 focus:outline-none focus:border-indigo-500"
    />
  </div>

  <!-- Description & Color -->
  <div class="space-y-1.5">
    <div class="flex justify-between items-center">
      <label class="text-xs font-bold text-slate-200">Intro Bio Description</label>
      <div class="flex items-center gap-1.5">
        <span class="text-xs text-slate-400">Color</span>
        <input
          type="color"
          [value]="hero.descColor || state.portfolio().colors.text"
          (input)="update({ descColor: $any($event.target).value })"
          class="w-7 h-7 rounded-lg border border-slate-700 bg-transparent cursor-pointer p-0.5"
        />
        <button
          *ngIf="hero.descColor"
          (click)="update({ descColor: undefined })"
          class="p-1 text-slate-400 hover:text-indigo-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
          title="Reset Description Color"
        >
          <app-icon name="rotate-ccw" [size]="14"></app-icon>
        </button>
      </div>
    </div>
    <textarea
      rows="3"
      [ngModel]="hero.description"
      (ngModelChange)="update({ description: $event })"
      class="w-full bg-slate-900 border border-slate-700 text-sm font-semibold text-slate-100 rounded-xl p-3 focus:outline-none focus:border-indigo-500"
    ></textarea>
  </div>

  <!-- RESUME DOCUMENT UPLOAD & BUTTON CONTROLS -->
  <div class="space-y-3 p-4 rounded-xl border border-indigo-500/30 bg-indigo-950/20">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <app-icon name="file-text" [size]="16" class="text-indigo-400"></app-icon>
        <label class="text-xs font-extrabold text-slate-100 uppercase tracking-wide">Resume Document & Button</label>
      </div>
      <span *ngIf="hero.resumeUrl" class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
        ✓ Resume Uploaded
      </span>
    </div>

    <!-- Resume Primary Button Label -->
    <div class="space-y-1">
      <label class="text-[11px] font-bold text-slate-300">Button Label</label>
      <input
        type="text"
        [ngModel]="hero.ctaPrimaryLabel"
        (ngModelChange)="update({ ctaPrimaryLabel: $event })"
        placeholder="Resume"
        class="w-full bg-slate-950 border border-slate-700 text-xs font-extrabold text-slate-100 rounded-lg p-2.5"
      />
    </div>

    <!-- Resume File Upload Input -->
    <div class="space-y-1.5 pt-1">
      <label class="text-[11px] font-bold text-slate-300">Upload Resume File (PDF / DOC)</label>
      <div class="flex items-center gap-2">
        <label class="flex-1 flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg border border-dashed border-indigo-500/40 bg-slate-900 hover:bg-slate-800 transition-colors cursor-pointer text-xs font-bold text-indigo-300">
          <app-icon name="upload" [size]="14"></app-icon>
          <span>{{ hero.resumeFileName ? hero.resumeFileName : 'Choose PDF or Document' }}</span>
          <input
            type="file"
            accept=".pdf,.doc,.docx"
            (change)="onResumeFileSelected($event)"
            class="hidden"
          />
        </label>
        <button
          *ngIf="hero.resumeUrl"
          (click)="clearResumeFile()"
          class="p-2 text-rose-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
          title="Remove Resume File"
        >
          <app-icon name="trash-2" [size]="16"></app-icon>
        </button>
      </div>
    </div>

    <!-- Direct Resume Link (Optional Alternative) -->
    <div class="space-y-1 pt-1">
      <label class="text-[11px] font-bold text-slate-400">Or Direct Resume URL / Link (e.g. Google Drive)</label>
      <input
        type="text"
        [ngModel]="hero.ctaPrimaryUrl"
        (ngModelChange)="update({ ctaPrimaryUrl: $event })"
        placeholder="https://drive.google.com/..."
        class="w-full bg-slate-950 border border-slate-700 text-xs font-mono text-slate-300 rounded-lg p-2.5"
      />
    </div>
  </div>

  <!-- Secondary CTA Button (Contact / Touch) -->
  <div class="space-y-2 p-3 rounded-xl border border-slate-800 bg-slate-900/60">
    <label class="text-xs font-bold text-slate-200">Secondary CTA Button</label>
    <div class="grid grid-cols-2 gap-2">
      <input
        type="text"
        placeholder="Button Label"
        [ngModel]="hero.ctaSecondaryLabel"
        (ngModelChange)="update({ ctaSecondaryLabel: $event })"
        class="bg-slate-950 border border-slate-700 text-xs font-bold text-slate-100 rounded-lg p-2.5"
      />
      <input
        type="text"
        placeholder="Target Link (#contact)"
        [ngModel]="hero.ctaSecondaryUrl"
        (ngModelChange)="update({ ctaSecondaryUrl: $event })"
        class="bg-slate-950 border border-slate-700 text-xs font-mono text-slate-300 rounded-lg p-2.5"
      />
    </div>
  </div>

  <!-- SOCIAL LINKS EDITOR (trackBy: trackByIndex keeps input focus) -->
  <div class="space-y-3 p-4 rounded-xl border border-slate-800 bg-slate-900/60">
    <div class="flex items-center justify-between">
      <label class="text-xs font-extrabold text-slate-200 uppercase tracking-wide">Social Media Links</label>
      <button
        (click)="addSocialLink()"
        class="flex items-center gap-1 text-xs font-bold text-indigo-400 hover:text-indigo-300 transition-colors cursor-pointer"
      >
        <app-icon name="plus" [size]="14"></app-icon>
        <span>Add Link</span>
      </button>
    </div>

    <div *ngIf="!hero.socialLinks?.length" class="text-xs text-slate-400 italic text-center py-2">
      No social links added yet. Click "+ Add Link" above to add one.
    </div>

    <div *ngFor="let s of hero.socialLinks; let i = index; trackBy: trackByIndex" class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 flex-1">
          <select
            [ngModel]="s.icon"
            (ngModelChange)="updateSocialLink(i, { icon: $event })"
            class="bg-slate-900 border border-slate-700 text-xs font-bold text-slate-200 rounded-lg p-2"
          >
            <option *ngFor="let opt of availableIcons" [value]="opt.value">{{ opt.label }}</option>
          </select>
          <input
            type="text"
            placeholder="Platform Name (e.g. GitHub)"
            [ngModel]="s.platform"
            (ngModelChange)="updateSocialLink(i, { platform: $event })"
            class="flex-1 bg-slate-900 border border-slate-700 text-xs font-semibold text-slate-100 rounded-lg p-2"
          />
        </div>
        <button
          (click)="removeSocialLink(i)"
          class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-900 rounded-lg transition-colors cursor-pointer"
          title="Delete Link"
        >
          <app-icon name="trash-2" [size]="14"></app-icon>
        </button>
      </div>
      <input
        type="text"
        placeholder="URL (https://github.com/username)"
        [ngModel]="s.url"
        (ngModelChange)="updateSocialLink(i, { url: $event })"
        class="w-full bg-slate-900 border border-slate-700 text-xs font-mono text-slate-300 rounded-lg p-2"
      />
    </div>
  </div>
</div>
